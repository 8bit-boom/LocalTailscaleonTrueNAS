###############################################################
#          Authelia configuration (optional 2FA gate)         #
###############################################################
#
# Edit the four placeholders below (search for CHANGE-ME) to match your
# real domains from .env before starting the "2fa" profile. Secrets
# (jwt_secret / session secret / storage encryption key) are NOT set
# here — they come from the AUTHELIA_*_FILE env vars in docker-compose.yml,
# generated by scripts/setup-2fa-secrets.sh into ./secrets/ (gitignored).
#
# See README "Optional: two-factor authentication" for the full walkthrough.

server:
  address: 'tcp://:9091'

log:
  level: 'info'

totp:
  issuer: 'headscale-admin'

identity_validation:
  reset_password:
    jwt_secret: '' # overridden by AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE

authentication_backend:
  # Password reset is disabled — edit users_database.yml directly and
  # regenerate the hash instead. Keeps this deployment from needing SMTP
  # just to recover one admin account.
  password_reset:
    disable: true
  file:
    path: '/config/users_database.yml'
    password:
      algorithm: 'argon2'

access_control:
  default_policy: 'deny'
  rules:
    - domain: 'CHANGE-ME-headscale-admin.example.com' # = HEADSCALE_ADMIN_DOMAIN in .env
      policy: 'two_factor'

session:
  secret: '' # overridden by AUTHELIA_SESSION_SECRET_FILE
  cookies:
    - name: 'authelia_session'
      domain: 'CHANGE-ME-example.com' # your zone apex — must cover both AUTHELIA_DOMAIN and HEADSCALE_ADMIN_DOMAIN
      authelia_url: 'https://CHANGE-ME-auth.example.com' # = AUTHELIA_DOMAIN in .env
      expiration: '1 hour'
      inactivity: '15 minutes'
      default_redirection_url: 'https://CHANGE-ME-headscale-admin.example.com' # = HEADSCALE_ADMIN_DOMAIN in .env

regulation:
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '15 minutes'

storage:
  encryption_key: '' # overridden by AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
  local:
    path: '/data/db.sqlite3'

notifier:
  # No SMTP for a single-admin home deployment — TOTP registration and any
  # identity-verification links get written here instead. Read with:
  #   docker exec authelia cat /data/notification.txt
  filesystem:
    filename: '/data/notification.txt'
